version: '3.8'

services:
  nids-app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: nids_realtime_system
    ports:
      - "8000:8000"
      - "8501:8501"
    volumes:
      - nids_data:/app/database
    environment:
      - NIDS_API_HOST=0.0.0.0
      - NIDS_API_PORT=8000
    restart: unless-stopped

volumes:
  nids_data:
